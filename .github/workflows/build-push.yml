name: Build and Push

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'components/**'
      - 'services/**'
      - 'hooks/**'
      - 'types/**'
      - 'nginx/**'
      - 'requirements.txt'
      - 'Dockerfile.backend'
      - 'Dockerfile.frontend'
      - 'package.json'
      - 'vite.config.ts'
      - '.env.example'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository_owner }}/kabu-agent-backend
  FRONTEND_IMAGE: ${{ github.repository_owner }}/kabu-agent-frontend
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-push-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDTIME=${{ github.event.head_commit.timestamp }}
            VERSION=${{ github.sha }}

  build-push-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-gitops:
    needs: [build-push-backend, build-push-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: ryokushaka/kabu-agent-gitops
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops

      - name: Update image tags in manifests
        run: |
          cd gitops

          # Update backend image tag
          sed -i "s|image: ghcr.io/ryokushaka/kabu-agent-backend:.*|image: ghcr.io/ryokushaka/kabu-agent-backend:${{ env.IMAGE_TAG }}|" \
            manifests/kabu-agent/backend/deployment.yaml

          # Update frontend image tag
          sed -i "s|image: ghcr.io/ryokushaka/kabu-agent-frontend:.*|image: ghcr.io/ryokushaka/kabu-agent-frontend:${{ env.IMAGE_TAG }}|" \
            manifests/kabu-agent/frontend/deployment.yaml

          echo "Updated image tags to: ${{ env.IMAGE_TAG }}"

      - name: Commit and Push changes
        run: |
          cd gitops
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🚀 deploy: Update images to ${{ env.IMAGE_TAG }}"
            git push
            echo "Successfully pushed changes to GitOps repository"
          fi

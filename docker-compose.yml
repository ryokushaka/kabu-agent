version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: kabu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kabu_agent
      POSTGRES_USER: kabu_user
      POSTGRES_PASSWORD: kabu_password
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - kabu-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kabu_user -d kabu_agent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: kabu-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redis_password --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - kabu-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: kabu-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://kabu_user:kabu_password@postgres:5432/kabu_agent
      REDIS_URL: redis://:redis_password@redis:6379/0
      KIS_APP_KEY: ${KIS_APP_KEY}
      KIS_APP_SECRET: ${KIS_APP_SECRET}
      KIS_ACCOUNT_NUMBER: ${KIS_ACCOUNT_NUMBER}
      KIS_IS_LIVE: ${KIS_IS_LIVE:-false}
      TRADING_ENV: ${TRADING_ENV}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ENVIRONMENT: production
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kabu-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: kabu-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - kabu-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M

  nginx:
    image: fholzer/nginx-brotli:latest
    container_name: kabu-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - kabu-network
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  kabu-network:
    driver: bridge

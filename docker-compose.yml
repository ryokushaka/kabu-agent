version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: kabu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kabu_agent
      POSTGRES_USER: kabu_user
      POSTGRES_PASSWORD: kabu_password
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - kabu-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kabu_user -d kabu_agent"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: kabu-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redis_password
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - kabu-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: kabu-backend
    restart: unless-stopped
    environment:
      # Database
      DATABASE_URL: postgresql://kabu_user:kabu_password@postgres:5432/kabu_agent
      # Redis
      REDIS_URL: redis://:redis_password@redis:6379/0
      # KIS API (will be loaded from .env)
      KIS_APP_KEY: ${KIS_APP_KEY}
      KIS_APP_SECRET: ${KIS_APP_SECRET}
      KIS_ACCOUNT_NUMBER: ${KIS_ACCOUNT_NUMBER}
      KIS_IS_LIVE: ${KIS_IS_LIVE:-false}
      TRADING_ENV: ${TRADING_ENV}
      # AI API
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # App settings
      ENVIRONMENT: production
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kabu-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # React Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: kabu-frontend
    restart: unless-stopped
    environment:
      REACT_APP_API_BASE_URL: http://localhost:8000
      NODE_ENV: production
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - kabu-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: kabu-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - kabu-network

# Named volumes for data persistence
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# Custom network
networks:
  kabu-network:
    driver: bridge
# =============================================================================
# Kiali Ingress Configuration
# =============================================================================
# Exposes Kiali dashboard via Traefik ingress
# -----------------------------------------------------------------------------

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kiali
  namespace: istio-system
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # Security: Add basic auth middleware for production
    # traefik.ingress.kubernetes.io/router.middlewares: istio-system-kiali-auth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: kiali.${DOMAIN_NAME}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kiali
                port:
                  number: 20001

---

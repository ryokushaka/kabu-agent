# =============================================================================
# Alertmanager Deployment
# =============================================================================
# Standalone Alertmanager for alert routing and notification
# Configured for Slack integration
# -----------------------------------------------------------------------------

---
# -----------------------------------------------------------------------------
# ConfigMap: Alertmanager Configuration
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
  labels:
    app: alertmanager
data:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m
      # Slack webhook URL - set via SealedSecret or environment
      # slack_api_url: '${SLACK_WEBHOOK_URL}'

    route:
      group_by: ['alertname', 'namespace', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'slack-notifications'
      routes:
        # Critical alerts go to dedicated channel
        - match:
            severity: critical
          receiver: 'slack-critical'
          continue: true
        # Warning alerts
        - match:
            severity: warning
          receiver: 'slack-notifications'
        # SLO alerts
        - match_re:
            slo: '.*'
          receiver: 'slack-slo'

    receivers:
      # Default notification channel
      - name: 'slack-notifications'
        slack_configs:
          - channel: '#kabu-alerts'
            send_resolved: true
            title: '{{ template "slack.title" . }}'
            text: '{{ template "slack.text" . }}'
            actions:
              - type: button
                text: 'Runbook'
                url: '{{ (index .Alerts 0).Annotations.runbook_url }}'
              - type: button
                text: 'Dashboard'
                url: 'https://grafana.${DOMAIN_NAME}/d/kabu-overview'

      # Critical alerts channel
      - name: 'slack-critical'
        slack_configs:
          - channel: '#kabu-alerts-critical'
            send_resolved: true
            color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
            title: '[CRITICAL] {{ .GroupLabels.alertname }}'
            text: |
              {{ range .Alerts }}
              *Alert:* {{ .Annotations.summary }}
              *Description:* {{ .Annotations.description }}
              *Severity:* {{ .Labels.severity }}
              *Namespace:* {{ .Labels.namespace }}
              {{ end }}

      # SLO alerts channel
      - name: 'slack-slo'
        slack_configs:
          - channel: '#kabu-slo'
            send_resolved: true
            title: '[SLO] {{ .GroupLabels.alertname }}'
            text: |
              {{ range .Alerts }}
              *SLO:* {{ .Labels.slo }}
              *Summary:* {{ .Annotations.summary }}
              *Description:* {{ .Annotations.description }}
              {{ end }}

    # Inhibition rules to suppress duplicate alerts
    inhibit_rules:
      # If critical alert fires, suppress warning
      - source_match:
          severity: 'critical'
        target_match:
          severity: 'warning'
        equal: ['alertname', 'namespace']

    templates:
      - '/etc/alertmanager/templates/*.tmpl'

---
# -----------------------------------------------------------------------------
# ConfigMap: Alert Templates
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-templates
  namespace: monitoring
  labels:
    app: alertmanager
data:
  slack.tmpl: |
    {{ define "slack.title" }}
    [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .GroupLabels.alertname }}
    {{ end }}

    {{ define "slack.text" }}
    {{ range .Alerts }}
    *Alert:* {{ .Annotations.summary }}
    *Description:* {{ .Annotations.description }}
    *Severity:* `{{ .Labels.severity }}`
    *Namespace:* {{ .Labels.namespace }}
    *Started:* {{ .StartsAt.Format "2006-01-02 15:04:05 MST" }}
    {{ if .EndsAt }}*Ended:* {{ .EndsAt.Format "2006-01-02 15:04:05 MST" }}{{ end }}
    ---
    {{ end }}
    {{ end }}

---
# -----------------------------------------------------------------------------
# Deployment: Alertmanager
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
      annotations:
        # Trigger restart on config change
        checksum/config: "{{ include (print $.Template.BasePath \"/alertmanager-config.yaml\") . | sha256sum }}"
    spec:
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534

      containers:
        - name: alertmanager
          image: quay.io/prometheus/alertmanager:v0.26.0
          imagePullPolicy: IfNotPresent

          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

          args:
            - --config.file=/etc/alertmanager/alertmanager.yaml
            - --storage.path=/alertmanager
            - --cluster.listen-address=
            - --web.external-url=https://alertmanager.${DOMAIN_NAME}
            - --log.level=warn

          ports:
            - name: http
              containerPort: 9093
              protocol: TCP

          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30

          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: templates
              mountPath: /etc/alertmanager/templates
            - name: storage
              mountPath: /alertmanager

          env:
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: alertmanager-secrets
                  key: slack-webhook-url
                  optional: true
            - name: DOMAIN_NAME
              valueFrom:
                configMapKeyRef:
                  name: kabu-config
                  key: domain-name
                  optional: true

      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: templates
          configMap:
            name: alertmanager-templates
        - name: storage
          emptyDir: {}

---
# -----------------------------------------------------------------------------
# Service: Alertmanager
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app: alertmanager
spec:
  type: ClusterIP
  selector:
    app: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: 9093
      protocol: TCP

---
# -----------------------------------------------------------------------------
# Ingress: Alertmanager (Optional - for direct access)
# -----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alertmanager
  namespace: monitoring
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # Basic auth for security (set credentials in secret)
    traefik.ingress.kubernetes.io/router.middlewares: monitoring-basic-auth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: alertmanager.${DOMAIN_NAME}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: alertmanager
                port:
                  number: 9093

# =============================================================================
# Grafana Admin Credentials Secret Template
# =============================================================================
# Template for secure Grafana admin credentials
#
# IMPORTANT: DO NOT commit actual secrets to version control!
#
# Usage:
#   1. Copy this file: cp grafana-secret-template.yaml grafana-secret.yaml
#   2. Generate a secure password: openssl rand -base64 24
#   3. Base64 encode your values:
#      - echo -n 'admin' | base64 → YWRtaW4=
#      - echo -n 'your-secure-password' | base64
#   4. Apply: kubectl apply -f grafana-secret.yaml
#
# For production:
#   - Use SealedSecrets: kubeseal < grafana-secret.yaml > grafana-sealed.yaml
#   - Or use External Secrets Operator with AWS Secrets Manager/Vault
#   - Or use SOPS for encrypted secrets in Git
# -----------------------------------------------------------------------------

apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: monitoring
  labels:
    app: grafana
type: Opaque
data:
  # Base64 encoded values
  # Default: admin / <auto-generated>
  # Replace with your own secure credentials

  # Username (default: admin)
  # echo -n 'admin' | base64 = YWRtaW4=
  admin-user: YWRtaW4=

  # Password - REPLACE THIS!
  # Generate: openssl rand -base64 24
  # Then encode: echo -n 'generated-password' | base64
  # Example placeholder (DO NOT USE IN PRODUCTION):
  admin-password: REPLACE_WITH_BASE64_ENCODED_PASSWORD

---
# =============================================================================
# Alternative: StringData (for convenience, Kubernetes will encode)
# =============================================================================
# Uncomment and use this version if you prefer not to pre-encode:
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: grafana-admin
#   namespace: monitoring
#   labels:
#     app: grafana
# type: Opaque
# stringData:
#   admin-user: admin
#   admin-password: your-secure-password-here

---
# =============================================================================
# SealedSecret Example (for GitOps)
# =============================================================================
# After installing sealed-secrets controller:
#   kubeseal --format yaml < grafana-secret.yaml > grafana-sealed-secret.yaml
#
# The sealed secret can be safely committed to Git.
# Only the controller in your cluster can decrypt it.
#
# apiVersion: bitnami.com/v1alpha1
# kind: SealedSecret
# metadata:
#   name: grafana-admin
#   namespace: monitoring
# spec:
#   encryptedData:
#     admin-user: <encrypted-value>
#     admin-password: <encrypted-value>

# =============================================================================
# Monitoring Stack RBAC Configuration
# =============================================================================
# ServiceAccounts, Roles, and RoleBindings for monitoring components
# Follows principle of least privilege
# -----------------------------------------------------------------------------

---
# =============================================================================
# Prometheus RBAC
# =============================================================================

# ServiceAccount for Prometheus
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
    component: server

---
# ClusterRole for Prometheus to scrape metrics
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
  labels:
    app: prometheus
rules:
  # Read pods, services, endpoints for service discovery
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - nodes/metrics
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]

  # Read configmaps for additional scrape configs
  - apiGroups: [""]
    resources:
      - configmaps
    verbs: ["get"]

  # Access to metrics endpoints
  - apiGroups: [""]
    resources:
      - nodes/metrics
    verbs: ["get"]

  # Access to non-resource URLs
  - nonResourceURLs:
      - "/metrics"
      - "/metrics/cadvisor"
    verbs: ["get"]

  # Extensions API access
  - apiGroups: ["extensions"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch"]

  # Networking API access
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch"]

---
# ClusterRoleBinding for Prometheus
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
  labels:
    app: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring

---
# =============================================================================
# Alertmanager RBAC
# =============================================================================

# ServiceAccount for Alertmanager
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app: alertmanager

---
# Role for Alertmanager (namespace-scoped)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app: alertmanager
rules:
  # Read secrets for Slack webhook and other notifications
  - apiGroups: [""]
    resources:
      - secrets
    resourceNames:
      - alertmanager-secrets
      - alertmanager-config
    verbs: ["get"]

  # Read configmaps for templates
  - apiGroups: [""]
    resources:
      - configmaps
    verbs: ["get", "list"]

---
# RoleBinding for Alertmanager
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app: alertmanager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: alertmanager
subjects:
  - kind: ServiceAccount
    name: alertmanager
    namespace: monitoring

---
# =============================================================================
# Grafana RBAC
# =============================================================================

# ServiceAccount for Grafana
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana

---
# Role for Grafana (namespace-scoped)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
rules:
  # Read secrets for admin credentials
  - apiGroups: [""]
    resources:
      - secrets
    resourceNames:
      - grafana
      - grafana-admin
    verbs: ["get"]

  # Read configmaps for dashboards and datasources
  - apiGroups: [""]
    resources:
      - configmaps
    verbs: ["get", "list", "watch"]

---
# RoleBinding for Grafana
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: grafana
subjects:
  - kind: ServiceAccount
    name: grafana
    namespace: monitoring

---
# =============================================================================
# Cross-Namespace Access for Prometheus
# =============================================================================

# Role in kabu-agent namespace for Prometheus scraping
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-scraper
  namespace: kabu-agent
  labels:
    app: prometheus
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - endpoints
    verbs: ["get", "list", "watch"]

---
# RoleBinding for Prometheus in kabu-agent namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-scraper
  namespace: kabu-agent
  labels:
    app: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-scraper
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring

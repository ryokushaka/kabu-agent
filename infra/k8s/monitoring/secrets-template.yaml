# =============================================================================
# Alertmanager Secrets Template
# =============================================================================
# This is a TEMPLATE file. Do NOT commit with actual secret values!
#
# Usage:
#   1. Copy this file: cp secrets-template.yaml secrets.yaml
#   2. Fill in your actual values
#   3. Apply: kubectl apply -f secrets.yaml
#   4. Or use sealed-secrets for GitOps
#
# For production, use SealedSecrets or external secret management:
#   https://github.com/bitnami-labs/sealed-secrets
# -----------------------------------------------------------------------------

---
# -----------------------------------------------------------------------------
# Alertmanager Secrets (Required for Slack notifications)
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-secrets
  namespace: monitoring
  labels:
    app: alertmanager
type: Opaque
stringData:
  # Slack Webhook URL - Get from: https://api.slack.com/messaging/webhooks
  slack-webhook-url: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"

---
# -----------------------------------------------------------------------------
# Grafana Admin Credentials (Optional - auto-generated if not set)
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: monitoring
  labels:
    app: grafana
type: Opaque
stringData:
  admin-user: "admin"
  admin-password: "CHANGE_THIS_PASSWORD"

---
# -----------------------------------------------------------------------------
# Basic Auth for Monitoring UIs (Optional)
# -----------------------------------------------------------------------------
# Generate with: htpasswd -nb admin <password> | base64
apiVersion: v1
kind: Secret
metadata:
  name: monitoring-basic-auth
  namespace: monitoring
  labels:
    app: monitoring
type: Opaque
data:
  # Format: username:password_hash (htpasswd format, base64 encoded)
  # Default: admin:admin (CHANGE THIS!)
  users: YWRtaW46JGFwcjEkLnNhbHQkSGFzaGVkUGFzc3dvcmQ=

# =============================================================================
# Jaeger All-in-One Deployment
# =============================================================================
# Lightweight distributed tracing system for single-node deployment
# Uses in-memory storage (suitable for development and small-scale production)
#
# For production with persistence, consider:
# - Jaeger with Elasticsearch/Cassandra backend
# - Tempo (Grafana's tracing backend)
# -----------------------------------------------------------------------------

---
# -----------------------------------------------------------------------------
# ConfigMap: Jaeger Sampling Configuration
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger-sampling
  namespace: monitoring
  labels:
    app: jaeger
data:
  sampling.json: |
    {
      "service_strategies": [
        {
          "service": "kabu-backend",
          "type": "probabilistic",
          "param": 0.1
        },
        {
          "service": "kabu-frontend",
          "type": "probabilistic",
          "param": 0.05
        }
      ],
      "default_strategy": {
        "type": "probabilistic",
        "param": 0.05
      }
    }

---
# -----------------------------------------------------------------------------
# Deployment: Jaeger All-in-One
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: monitoring
  labels:
    app: jaeger
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/component: all-in-one
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
        app.kubernetes.io/name: jaeger
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "14269"
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001

      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.52  # ARM64 supported
          imagePullPolicy: IfNotPresent

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          ports:
            # UI and Query API
            - name: ui
              containerPort: 16686
              protocol: TCP
            # HTTP collector (Thrift)
            - name: http-collector
              containerPort: 14268
              protocol: TCP
            # gRPC collector
            - name: grpc-collector
              containerPort: 14250
              protocol: TCP
            # OTLP gRPC receiver
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            # OTLP HTTP receiver
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            # Admin port (health/metrics)
            - name: admin
              containerPort: 14269
              protocol: TCP
            # Agent compact thrift
            - name: agent-compact
              containerPort: 6831
              protocol: UDP
            # Agent binary thrift
            - name: agent-binary
              containerPort: 6832
              protocol: UDP

          env:
            # Enable OTLP receivers
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
            # Use in-memory storage (lightweight)
            - name: SPAN_STORAGE_TYPE
              value: "memory"
            # Memory storage limits
            - name: MEMORY_MAX_TRACES
              value: "10000"
            # Sampling configuration
            - name: SAMPLING_STRATEGIES_FILE
              value: /etc/jaeger/sampling.json
            # Query service base path
            - name: QUERY_BASE_PATH
              value: /jaeger

          volumeMounts:
            - name: sampling-config
              mountPath: /etc/jaeger
              readOnly: true

          livenessProbe:
            httpGet:
              path: /
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 30

          readinessProbe:
            httpGet:
              path: /
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 10

      volumes:
        - name: sampling-config
          configMap:
            name: jaeger-sampling

---
# -----------------------------------------------------------------------------
# Service: Jaeger Query (UI)
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: jaeger-query
  namespace: monitoring
  labels:
    app: jaeger
spec:
  type: ClusterIP
  selector:
    app: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: 16686
      protocol: TCP

---
# -----------------------------------------------------------------------------
# Service: Jaeger Collector
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: jaeger-collector
  namespace: monitoring
  labels:
    app: jaeger
spec:
  type: ClusterIP
  selector:
    app: jaeger
  ports:
    - name: grpc
      port: 14250
      targetPort: 14250
      protocol: TCP
    - name: http
      port: 14268
      targetPort: 14268
      protocol: TCP
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP

---
# -----------------------------------------------------------------------------
# Service: Jaeger Agent (UDP)
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: jaeger-agent
  namespace: monitoring
  labels:
    app: jaeger
spec:
  type: ClusterIP
  selector:
    app: jaeger
  ports:
    - name: agent-compact
      port: 6831
      targetPort: 6831
      protocol: UDP
    - name: agent-binary
      port: 6832
      targetPort: 6832
      protocol: UDP

---
# -----------------------------------------------------------------------------
# Ingress: Jaeger UI
# -----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jaeger
  namespace: monitoring
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: jaeger.${DOMAIN_NAME}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jaeger-query
                port:
                  number: 16686

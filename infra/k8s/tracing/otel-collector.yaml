# =============================================================================
# OpenTelemetry Collector Deployment
# =============================================================================
# Lightweight OTel Collector for trace processing and forwarding
# Receives traces from applications and forwards to Jaeger
#
# This is optional - applications can send directly to Jaeger OTLP endpoint
# Benefits: centralized processing, sampling, and future flexibility
# -----------------------------------------------------------------------------

---
# -----------------------------------------------------------------------------
# ConfigMap: OTel Collector Configuration
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: monitoring
  labels:
    app: otel-collector
data:
  config.yaml: |
    # ==========================================================================
    # OpenTelemetry Collector Configuration
    # ==========================================================================

    # --------------------------------------------------------------------------
    # Receivers: Accept telemetry data
    # --------------------------------------------------------------------------
    receivers:
      # OTLP receiver for traces and metrics
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    # --------------------------------------------------------------------------
    # Processors: Transform and process data
    # --------------------------------------------------------------------------
    processors:
      # Batch processor for efficient exporting
      batch:
        timeout: 10s
        send_batch_size: 512
        send_batch_max_size: 1024

      # Memory limiter to prevent OOM
      memory_limiter:
        check_interval: 1s
        limit_mib: 100
        spike_limit_mib: 20

      # Resource detection (adds k8s metadata)
      resourcedetection:
        detectors: [env, system]
        timeout: 2s
        override: false

      # Probabilistic sampler (additional sampling at collector level)
      probabilistic_sampler:
        sampling_percentage: 100  # Keep all traces (sampling done at app level)

    # --------------------------------------------------------------------------
    # Exporters: Send data to backends
    # --------------------------------------------------------------------------
    exporters:
      # Export traces to Jaeger via OTLP
      otlp/jaeger:
        endpoint: jaeger-collector.monitoring.svc.cluster.local:4317
        tls:
          insecure: true

      # Export metrics to Prometheus (optional)
      prometheus:
        endpoint: 0.0.0.0:8888
        namespace: otel
        const_labels:
          collector: otel-collector

      # Debug exporter for troubleshooting
      debug:
        verbosity: basic

    # --------------------------------------------------------------------------
    # Extensions: Additional capabilities
    # --------------------------------------------------------------------------
    extensions:
      # Health check endpoint
      health_check:
        endpoint: 0.0.0.0:13133

      # Performance profiler (disabled in production)
      pprof:
        endpoint: 0.0.0.0:1777

      # zPages for debugging
      zpages:
        endpoint: 0.0.0.0:55679

    # --------------------------------------------------------------------------
    # Service: Pipeline configuration
    # --------------------------------------------------------------------------
    service:
      extensions: [health_check, pprof, zpages]

      pipelines:
        # Traces pipeline
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resourcedetection, batch]
          exporters: [otlp/jaeger]

        # Metrics pipeline (collector's own metrics)
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [prometheus]

      telemetry:
        logs:
          level: warn
        metrics:
          level: basic
          address: 0.0.0.0:8888

---
# -----------------------------------------------------------------------------
# Deployment: OTel Collector
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: monitoring
  labels:
    app: otel-collector
    app.kubernetes.io/name: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8888"
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001

      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.91.0  # ARM64 supported
          imagePullPolicy: IfNotPresent

          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

          command:
            - /otelcol-contrib
            - --config=/etc/otelcol/config.yaml

          ports:
            # OTLP gRPC receiver
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            # OTLP HTTP receiver
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            # Prometheus metrics
            - name: metrics
              containerPort: 8888
              protocol: TCP
            # Health check
            - name: health
              containerPort: 13133
              protocol: TCP
            # zPages
            - name: zpages
              containerPort: 55679
              protocol: TCP

          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 30

          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10

          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true

      volumes:
        - name: config
          configMap:
            name: otel-collector-config

---
# -----------------------------------------------------------------------------
# Service: OTel Collector
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: monitoring
  labels:
    app: otel-collector
spec:
  type: ClusterIP
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
    - name: metrics
      port: 8888
      targetPort: 8888
      protocol: TCP
